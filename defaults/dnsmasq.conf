# reference-dnsmasq baked-in defaults.
#
# This file is the minimal config the image ships with. To add domains,
# A/MX/TXT records, etc., mount your config snippets at /etc/dnsmasq-overlay/
# (see README). The entrypoint loads that directory via --conf-dir.

# By default dnsmasq listens on every interface inside the container.
# Don't add `listen-address` here — it constrains rather than expands.

# Don't read /etc/resolv.conf — the image is meant to be authoritative
# for whatever domains the consumer configures.
no-resolv

# Refuse upstream forwarding by default. If consumers want a forwarder,
# they add `server=...` lines via overlay.
no-hosts

# Cache size — small default; consumers can override via overlay.
cache-size=1000

# Log to stderr (--log-facility=- is set on the command line).
